<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ركن الرياضيات — مدارس المحافظة الأهلية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lalezar&family=Readex+Pro:wght@400;600;700&display=swap">
<style>
:root{--ink:#1c2a39;--ink-2:#4b5d70;--paper:#fffaf0;--orange:#ff7a1a;--green:#22a861;--line:#d9c9a8;
 --display:"Lalezar","Readex Pro",Tahoma,sans-serif;--body:"Readex Pro",Tahoma,"Segoe UI",sans-serif}
*{box-sizing:border-box}
body{margin:0;background:#f3ecdd;font-family:var(--body);color:var(--ink)}
.wrap{max-width:760px;margin:0 auto;padding:14px}
.chome{background:var(--paper);border:3px solid var(--line);border-radius:18px;padding:20px 16px 14px;display:flex;flex-direction:column;gap:16px}
.cbrand{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}
.clogo{width:min(200px,60%);height:auto;border-radius:12px}
.ctitle{font-family:var(--display);font-size:clamp(2.2rem,8vw,3rem);line-height:1.1;margin:6px 0 0}
.csub{margin:0;color:var(--ink-2);font-weight:600;font-size:1rem}
.ctiles{display:flex;flex-direction:column;gap:12px}
.ctile{display:flex;flex-direction:column;gap:8px;text-align:right;cursor:pointer;background:#fffdf6;border:3px solid var(--ink);border-radius:16px;padding:14px 16px;font-family:var(--body);color:var(--ink);box-shadow:0 4px 0 var(--line)}
.ctile:active{transform:translateY(1px)}
.ctname{font-family:var(--display);font-size:1.9rem;line-height:1.15;color:var(--orange)}
.ctile.d .ctname{color:var(--green)}
.ctile.a .ctname{color:#1d4ed8}
.ctile.f .ctname{color:#7b1fa2}
.ctdesc{font-size:.98rem;line-height:1.7;color:var(--ink-2)}
.ctgo{align-self:flex-start;background:var(--orange);color:#fff;font-weight:700;border-radius:999px;padding:6px 18px}
.ctile.d .ctgo{background:var(--green)}
.ctile.a .ctgo{background:#1d4ed8}
.ctile.f .ctgo{background:#7b1fa2}
.cfoot{margin:0;text-align:center;color:var(--ink-2);font-size:.85rem}
.host{display:none;flex-direction:column}
.hostbar{display:flex;align-items:center;gap:12px;padding:4px 2px 10px}
.hostback{border:3px solid var(--ink);background:var(--paper);color:var(--ink);font-weight:700;font-size:1rem;border-radius:999px;padding:6px 18px;cursor:pointer;font-family:inherit}
.hosttitle{font-weight:700;color:var(--ink-2)}
.modframe{width:100%;border:0;display:block;background:transparent;overflow:hidden}
@media print{.hostbar{display:none!important}}
</style>
</head>

amily:var(--f-display);font-size:clamp(28px,3.4vw,42px);font-weight:700;line-height:1.2}\n.addsub .tag{font-size:14px;color:var(--pen);border:1.5px solid currentColor;border-radius:999px;padding:1px 12px;font-weight:600}\n.addsub .sheetWrap{overflow-x:auto;display:flex;justify-content:center;padding:8px 2px 12px}\n.addsub .sheet{display:grid;direction:ltr;flex:none;background:var(--paper);border-radius:10px;padding:10px;box-shadow:0 1px 0 var(--line),0 8px 22px rgba(20,40,70,.1)}\n.addsub .cell{display:flex;align-items:center;justify-content:center;width:var(--cw);height:var(--cw);font-size:calc(var(--cw)*.6);font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums;border-radius:4px}\n.addsub .cell.sign{font-size:calc(var(--cw)*.55);color:var(--muted)}\n.addsub .cell.carry{color:var(--pen);font-weight:700;font-size:calc(var(--cw)*.42)}\n.addsub .cell.borrow{color:#5a2a6e;font-weight:700;font-size:calc(var(--cw)*.42)}\n.addsub .cell.ans{border-top:0;font-weight:700}\n.addsub .cell.hlc{background:var(--hl)}\n.addsub .uline{border-bottom:2.5px solid var(--ink);margin:2px 4px;height:4px}\n.addsub .result{display:flex;flex-direction:column;align-items:center;gap:2px;background:var(--soft);border-radius:12px;padding:10px 14px;text-align:center}\n.addsub .result .big{font-family:var(--f-display);font-size:clamp(22px,2.6vw,32px);font-weight:700}\n.addsub .result .big em{font-style:normal;color:var(--pen)}\n.addsub .result .sub{color:var(--muted);font-size:15px}\n.addsub .side{display:flex;flex-direction:column;gap:14px;min-width:0}\n.addsub .card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px}\n.addsub .stepHead{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:14px;color:var(--muted)}\n.addsub .prog{height:6px;border-radius:6px;background:var(--soft);overflow:hidden}\n.addsub .prog i{display:block;height:100%;background:var(--accent);border-radius:6px;t sub .practice{display:flex;flex-direction:column;gap:10px}\n.addsub .pRow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}\n.addsub .pRow input{flex:1;min-width:100px;font:inherit;font-size:20px;font-weight:700;text-align:center;padding:8px 10px;border:2px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink)}\n.addsub .pfb{margin:0;font-weight:600;min-height:1.4em;font-size:15px}\n.addsub .pfb.ok{color:var(--ok)}\n.addsub .pfb.bad{color:var(--pen)}\n\n.addsub .scard{position:fixed;inset:0;z-index:80;background:rgba(28,42,57,.45);display:flex;align-items:center;justify-content:center;padding:14px}\n.addsub .scBox{background:var(--panel);border:2px solid var(--accent);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px;width:min(100%,430px);max-height:92vh;overflow:auto}\n.addsub .scHead{font-family:var(--f-display);font-weight:700;font-size:20px;color:var(--accent)}\n.addsub .scNameRow label{display:flex;gap:8px;align-items:center;font-weight:600;color:var(--muted);font-size:14px}\n.addsub .scNameRow input{flex:1;font:inherit;font-size:17px;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink)}\n.addsub .scView{background:var(--paper);border:1px dashed var(--accent);border-radius:12px;padding:14px;text-align:center;display:flex;flex-direction:column;gap:8px}\n.addsub .scTitle{font-family:var(--f-display);font-size:24px;font-weight:700}\n.addsub .scMeta{color:var(--muted);font-size:13px}\n.addsub .scStats{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}\n.addsub .scStats>div{display:flex;flex-direction:column;min-width:88px;background:var(--soft);border-radius:10px;padding:8px 10px}\n.addsub .scStats b{font-size:24px;font-family:var(--f-display)}\n.addsub .scStats span{font-size:12.5px;color:var(--muted);font-weight:600}\n.addsub .scNote{font-size:13px;color:var(--muted)}\n\n<\/style>\n<\/head>\n<body>\n<div class=\"addsub\">\n<div class=\"app\" dir=\"rtl\" lang=\"ar\">\n  <header class=\"top\">\n    <div class=\"brand\">\n      <h1>الجمع والطرح خطوة بخطوة<\/h1>\n      <p>بالحمل والاستلاف مع المكعبات · المرحلة الابتدائية<\/p>\n    <\/div>\n    <div class=\"tools\">\n      <div class=\"seg\" role=\"group\" aria-label=\"العملية\">\n        <button id=\"as-opAdd\" aria-pressed=\"true\">جمع<\/button>\n        <button id=\"as-opSub\" aria-pressed=\"false\">طرح<\/button>\n      <\/div>\n      <div class=\"seg\" role=\"group\" aria-label=\"عدد الخانات\">\n        <button id=\"as-d2\" aria-pressed=\"true\">رقمان<\/button>\n        <button id=\"as-d3\" aria-pressed=\"false\">ثلاثة أرقام<\/button>\n      <\/div>\n      <div class=\"seg\" role=\"group\" aria-label=\"الوضع\">\n        <button id=\"as-modePrac\" aria-pressed=\"true\">أحل بنفسي<\/button>\n        <button id=\"as-modeExp\" aria-pressed=\"false\">أشرح لي<\/button>\n      <\/div>\n    <\/div>\n  <\/header>\n\n  <div class=\"picker\">\n    <button class=\"chip rand\" id=\"as-rand\"><b>مثال جديد<\/b><small>مسألة فيها حمل أو استلاف<\/small><\/button>\n    <details class=\"custom\" id=\"as-customBox\">\n      <summary>مسألتي — أدخل أعدادك<\/summary>\n      <div class=\"customForm\" id=\"as-customForm\">\n        <label>العدد الأول<input id=\"as-ca\" inputmode=\"numeric\" autocomplete=\"off\" placeholder=\"مثل ٤٥٧\"><\/label>\n        <label>العدد الثاني<input id=\"as-cb\" inputmode=\"numeric\" autocomplete=\"off\" placeholder=\"مثل ٢٦٨\"><\/label>\n        <button class=\"btn\" type=\"button\" id=\"as-solve\">حل خطوة بخطوة<\/button>\n        <p class=\"err\" id=\"as-cErr\" hidden><\/p>\n      <\/div>\n    <\/details>\n    <button class=\"chip\" id=\"as-cardBtn\"><b>🏅 بطاقة إنجازي<\/b><small>نتيجتك في هذه الجلسة<\/small><\/button>\n  <\/div>\n  <div class=\"scard\" id=\"as-scard\" hidden>\n    <div class=\"scBox\">\n    <div class=\"scHead\">🏅 بطاقة إنجاز<\/div>\n    <div class=\"scNameRow\"><label>اسم الطالب<input id=\"as-scName\" autocomplete=\"off\" placeholder=\"اكتب اسمك\"><\/label><\/div>\n    <div class=\"scView\">\n      <div class=\"scTitle\" id=\"as-scWho\">—<\/div>\n      <div class=\"scMeta\">ركن الرياضيات · الجمع والطرح خطوة بخطوة · <span id=\"as-scDate\"><\/span><\/div>\n      <div class=\"scStats\">\n        <div><b id=\"as-scDone\">٠<\/b><span>مسائل مكتملة<\/span><\/div>\n        <div><b id=\"as-scFirst\">٠<\/b><span>من أول مرة دون مساعدة<\/span><\/div>\n        <div><b id=\"as-scAssist\">٠<\/b><span>بعد تلميح أو محاولة<\/span><\/div>\n      <\/div>\n      <div class=\"scNote\">صوّر البطاقة وأرسلها إلى معلمك<\/div>\n    <\/div>\n    <div class=\"nav\"><button class=\"btn ghost\" id=\"as-scReset\">جلسة جديدة<\/button><button class=\"btn\" id=\"as-scClose\">إغلاق<\/button><\/div>\n    <\/div>\n  <\/div>\n\n  <main class=\"main\">\n    <section class=\"boardPanel\" aria-label=\"لوحة الحل\">\n      <div class=\"exprRow\">\n        <div class=\"expr\" id=\"as-expr\"><\/div>\n        <span class=\"tag\" id=\"as-tag\"><\/span>\n      <\/div>\n      <div class=\"sheetWrap\"><div class=\"sheet\" id=\"as-sheet\"><\/div><\/div>\n      <div class=\"result\" id=\"as-result\" hidden>\n        <div class=\"big\" id=\"as-resBig\"><\/div>\n        <div class=\"sub\" id=\"as-resSub\"><\/div>\n      <\/div>\n    <\/section>\n\n    <aside class=\"side\">\n      <div class=\"card\">\n        <div class=\"stepHead\"><span id=\"as-count\"><\/span><span id=\"as-place\"><\/span><\/div>\n        <div class=\"prog\"><i id=\"as-progI\"><\/i><\/div>\n        <h2 class=\"stepTitle\" id=\"as-stepTitle\"><\/h2>\n        <p class=\"ask\" id=\"as-ask\"><\/p>\n        <p class=\"explain\" id=\"as-explain\"><\/p>\n        <div class=\"practice\" id=\"as-practice\" hidden>\n          <p class=\"ask\" id=\"as-pQ\"><\/p>\n          <div class=\"pRow\">\n            <input id=\"as-pIn\" inputmode=\"numeric\" autocomplete=\"off\" placeholder=\"إجابتك\">\n            <button class=\"btn\" type=\"button\" id=\"as-pCheck\">تحقق<\/button>\n            <button class=\"btn ghost\" type=\"button\" id=\"as-pHint\">تلميح<\/button>\n          <\/div>\n          <p class=\"pfb\" id=\"as-pFb\"><\/p>\n        <\/div>\n        <div class=\"blocks\" id=\"as-blocks\" aria-label=\"النموذج بالمكعبات\"><\/div>\n        <div class=\"nav\" id=\"as-navRow\">\n          <button class=\"btn ghost\" id=\"as-prev\">← السابق<\/button>\n          <button class=\"btn\" id=\"as-next\">التالي ←<\/button>\n        <\/div>\n      <\/div>\n      <div class=\"card\" id=\"as-doneCard\" hidden>\n        <h2 class=\"stepTitle\">أحسنت! اكتمل الحل<\/h2>\n        <p class=\"explain\" id=\"as-doneTxt\"><\/p>\n        <div class=\"nav\">\n          <button class=\"btn\" id=\"as-again\">مثال جديد<\/button>\n          <button class=\"btn ghost\" id=\"as-custom2\">مسألتي<\/button>\n        <\/div>\n      <\/div>\n    <\/aside>\n  <\/main>\n\n  <footer>إعداد <b>الأستاذ عبدالرحمن سلطان<\/b> · معلم الرياضيات<\/footer>\n<\/div>\n\n<\/div>\n<script>\n/* Addition/subtraction step-by-step runtime. Element listeners only; no document/window listeners, no observers, no timers — unmount-clean. */\n\n(function(){\n  const $=id=>document.getElementById(id);\n  const AR=['٠','١','٢','٣','٤','٥','٦','٧','٨','٩'];\n  const ar=v=>String(v).replace(/\\d/g,d=>AR[d]);\n  const parseNum=s=>{\n    const t=(s||'').trim().replace(/[٠-٩]/g,d=>String(AR.indexOf(d))).replace(/[,\\s]/g,'');\n    return /^\\d{1,3}$/.test(t)?Number(t):null;\n  };\n  const PLACES=['الآحاد','العشرات','المئات','الألوف'];\n  const BLOCKN=['مكعب','عمود','مربع'];\n\n  // state\n  let op='add', digits=2, a=0, b=0, steps=[], idx=0, carries=[], borrows=[], ans='';\n  let mode='practice', tasks=[], ti=0, attempts=0;\n\n  // ---- achievement card (local session, manual screenshot sharing) ----\n  const SS={done:0,first:0,assist:0};\n  let probWrong=false, probHint=false;\n  function updateCard(){\n    $('as-scWho').textContent=$('as-scName').value.trim()||'—';\n    const d=new Date();\n    $('as-scDate').textContent=ar(d.getDate())+'/'+ar(d.getMonth()+1)+'/'+ar(d.getFullYear());\n    $('as-scDone').textContent=ar(SS.done);\n    $('as-scFirst').textContent=ar(SS.first);\n    $('as-scAssist').textContent=ar(SS.assist);\n  }\n  function countProblem(){\n    SS.done++;\n    if(!probWrong&&!probHint)SS.first++;else SS.assist++;\n    updateCard();\n  }\n  $('as-cardBtn').onclick=()=>{const c=$('as-scard');c.hidden=!c.hidden;if(!c.hidden)updateCard();};\n  $('as-scName').addEventListener('input',updateCard);\n  $('as-scClose').onclick=()=>{$('as-scard').hidden=true;};\n  $('as-scReset').onclick=()=>{SS.done=SS.first=SS.assist=0;updateCard();};\n\n\n  function digitsOf(n,len){const s=String(n).padStart(len,'0');return s.split('').map(Number);}\n\n  function buildSteps(){\n    const A=digitsOf(a,digits), B=digitsOf(b,digits);\n    steps=[];carries=[];borrows=[];\n    if(op==='add'){\n      let c=0;\n      for(let i=0;i<digits;i++){\n        const p=digits-1-i, d1=A[p], d2=B[p], s=d1+d2+c;\n        steps.push({place:i,d1,d2,cin:c,sum:s,w:s%10,cout:s>=10?1:0,at:i});\n        c=s>=10?1:0;\n      }\n      if(c)steps.push({place:digits,d1:0,d2:0,cin:1,sum:1,w:1,cout:0,finalCarry:true});\n      ans=String(a+b);\n    }else{\n      const A2=A.slice();\n      for(let i=0;i<digits;i++){\n        const p=digits-1-i;\n        let d1=A2[p];const d2=B[p];let borrowed=false;const lent=[];\n        if(d1<d2){ // borrow from next column\n          let j=p-1;\n          while(j>=0&&A2[j]===0){A2[j]=9;lent.push({col:digits-j,v:9});j--;}\n          if(j>=0){A2[j]--;lent.push({col:digits-j,v:A2[j]});}\n          d1+=10;borrowed=true;\n        }\n        steps.push({place:i,d1,d2,borrowed,w:d1-d2,lent,at:i});\n      }\n      ans=String(a-b);\n    }\n  }\n\n  // ---- board ----\n  function renderSheet(){\n    const sh=$('as-sheet');sh.innerHTML='';\n    const cols=digits+1; // extra left col for sign/final carry\n    sh.style.gridTemplateColumns='repeat('+cols+', var(--cw))';\n    const A=digitsOf(a,digits), B=digitsOf(b,digits);\n    const cell=(txt,cls)=>{const e=document.createElement('div');e.className='cell '+(cls||'');e.textContent=txt;sh.appendChild(e);return e;};\n    // carry row\n    for(let cIdx=0;cIdx<cols;cIdx++){\n      const colFromRight=cols-1-cIdx;\n      const cv=carries.find(x=>x.col===colFromRight&&(mode==='explain'?x.at<=idx:tasks.slice(0,ti).some(t=>t.type==='carry'&&t.step===x.step)));\n      cell(cv?ar(cv.v):'','carry'+(cv&&cv.at===idx?' new':''));\n    }\n    // borrow row (subtraction): shows reduced digits above operands\n    if(op==='sub'){\n      for(let cIdx=0;cIdx<cols;cIdx++){\n        const colFromRight=cols-1-cIdx;\n        const vis=borrows.filter(x=>x.col===colFromRight&&(mode==='explain'?x.at<=idx:tasks.slice(0,ti).some(t=>t.type==='lent'&&t.step===x.step)));\n        const bv=vis.length?vis[vis.length-1]:null;\n        cell(bv?ar(bv.v):'','borrow'+(bv&&bv.at===idx?' new':''));\n      }\n    }\n    // row a\n    cell('','sign');\n    A.forEach((d,i)=>cell(ar(d),'dig col-'+(digits-i)+(borrows.find(x=>x.col===digits-i&&x.struck)?' struck':'')));\n    // row b\n    cell(op==='add'?'+':'−','sign');\n    B.forEach((d,i)=>cell(ar(d),'dig col-'+(digits-i)));\n    // line\n    for(let cIdx=0;cIdx<cols;cIdx++){const e=document.createElement('div');e.className='uline';sh.appendChild(e);}\n    // answer row\n    const ansA=digitsOf(Number(ans),ans.length);\n    for(let cIdx=0;cIdx<cols;cIdx++){\n      const colFromRight=cols-1-cIdx;\n      const shown=mode==='explain'?steps.slice(0,idx+1).some(s=>s.place===colFromRight):tasks.slice(0,ti).some(t=>t.type==='digit'&&steps[t.step].place===colFromRight);\n      const av=colFromRight<ans.length?ansA[ansA.length-1-colFromRight]:null;\n      cell(shown&&av!=null?ar(av):'',shown?'dig ans new':'dig ans');\n    }\n  }\n\n  function markActive(){\n    const sh=$('as-sheet');\n    sh.querySelectorAll('.hlc').forEach(e=>e.classList.remove('hlc'));\n    let cur=-1;\n    if(mode==='explain'){if(idx<steps.length)cur=steps[idx].place;}\n    else if(ti<tasks.length)cur=steps[tasks[ti].step].place;\n    if(cur<0)return;\n    const colFromRight=cur;\n    const cols=digits+1;\n    const colIdx=cols-1-colFromRight; // grid column index (0-based) within each row\n    const rows=sh.children.length/cols;\n    for(let r=0;r<rows;r++){\n      const e=sh.children[r*cols+colIdx];\n      if(e)e.classList.add('hlc');\n    }\n  }\n\n  // ---- blocks ----\n  function blockEl(place,crossed){\n    const e=document.createElement('span');\n    e.className='blk b'+place+(crossed?' crossed':'');\n    return e;\n  }\n  function group(label,count,place,opts){\n    const g=document.createElement('div');g.className='bgroup';\n    const t=document.createElement('div');t.className='blabel';t.textContent=label;g.appendChild(t);\n    const row=document.createElement('div');row.className='brow';\n    for(let i=0;i<count;i++)row.appendChild(blockEl(place,opts&&opts.cross&&i>=count-(opts.cross)));\n    g.appendChild(row);\n    return g;\n  }\n  function renderBlocksFor(s,hintTask){\n    const box=$('as-blocks');\n    if(op==='add'){\n      if(s.finalCarry){\n        box.appendChild(group('الحمل الأخير إلى '+PLACES[s.place],1,s.place));\n        return;\n      }\n      box.appendChild(group(ar(s.d1)+' + '+ar(s.d2)+(s.cin?' + '+ar(s.cin)+' (الحمل)':''),s.d1+s.d2+s.cin,s.place));\n      if(s.sum>=10){\n        const arrow=document.createElement('div');arrow.className='barrow';arrow.textContent='← نحوّل '+ar(10)+' إلى '+BLOCKN[s.place+1]+' واحد';box.appendChild(arrow);\n        box.appendChild(group('الباقي في '+PLACES[s.place],s.w,s.place));\n      }\n    }else{\n      if(s.borrowed){\n        box.appendChild(group('نستلف '+BLOCKN[s.place+1]+'ًا ونفككه إلى '+ar(10)+' '+BLOCKN[s.place],10,s.place));\n        if(hintTask==='lent')return;\n        const arrow=document.createElement('div');arrow.className='barrow';arrow.textContent='↓ '+ar(s.d1)+' − '+ar(s.d2);box.appendChild(arrow);\n        box.appendChild(group('نطرح '+ar(s.d2),s.d1,s.place,{cross:s.d2}));\n      }else{\n        box.appendChild(group(ar(s.d1)+' − '+ar(s.d2),s.d1,s.place,{cross:s.d2}));\n      }\n    }\n  }\n\n  function renderBlocks(){\n    const box=$('as-blocks');box.innerHTML='';\n    if(idx>=steps.length)return;\n    renderBlocksFor(steps[idx]);\n  }\n\n  // ---- practice mode: the student solves, with simple guidance ----\n  function buildTasks(){\n    tasks=[];\n    steps.forEach((s,i)=>{\n      if(op==='add'){\n        tasks.push({step:i,type:'digit'});\n        if(s.cout)tasks.push({step:i,type:'carry'});\n      }else{\n        if(s.borrowed)tasks.push({step:i,type:'lent'});\n        tasks.push({step:i,type:'digit'});\n      }\n    });\n  }\n  function expected(t,s){return t.type==='digit'?(s.finalCarry?1:(op==='add'?s.sum:s.w)):t.type==='carry'?1:s.d1;}\n  function questionText(t,s){\n    if(t.type==='carry')return 'الناتج '+ar(s.sum)+' فيه عشرة كاملة: كتبنا '+ar(s.w)+' في '+PLACES[s.place]+'، فماذا نحمل إلى '+PLACES[s.place+1]+'؟';\n    if(t.type==='lent')return ar(s.d1-10)+' أصغر من '+ar(s.d2)+'، فنستلف من '+PLACES[s.place+1]+'. كم يصبح رقم '+PLACES[s.place]+' بعد الاستلاف؟';\n    if(op==='add'){\n      if(s.finalCarry)return 'بقي الحمل الأخير من الخطوة السابقة، اكتبه في خانة '+PLACES[s.place]+'.';\n      return 'اجمع '+PLACES[s.place]+': '+ar(s.d1)+' + '+ar(s.d2)+(s.cin?' + '+ar(s.cin)+' (الحمل)':'')+' = ؟';\n    }\n    return 'اطرح '+PLACES[s.place]+': '+ar(s.d1)+' − '+ar(s.d2)+' = ؟';\n  }\n  function renderPractice(){\n    if(ti>=tasks.length)return;\n    const t=tasks[ti],s=steps[t.step];\n    $('as-count').textContent='السؤال '+ar(ti+1)+' من '+ar(tasks.length);\n    $('as-place').textContent=PLACES[s.place];\n    $('as-progI').style.width=(ti/tasks.length*100)+'%';\n    $('as-stepTitle').textContent=t.type==='digit'?(op==='add'?'أنت تجمع '+PLACES[s.place]:'أنت تطرح '+PLACES[s.place]):t.type==='carry'?'فكّر في الحمل':'فكّر في الاستلاف';\n    $('as-pQ').textContent=questionText(t,s);\n    $('as-pIn').value='';\n    $('as-pFb').textContent='';$('as-pFb').className='pfb';\n    $('as-blocks').innerHTML='';\n    attempts=0;\n  }\n  function showHint(){\n    if(ti>=tasks.length)return;\n    probHint=true;\n    const t=tasks[ti],s=steps[t.step];\n    const box=$('as-blocks');box.innerHTML='';\n    const lbl=document.createElement('div');lbl.className='blabel';\n    lbl.textContent=t.type==='lent'?'تلميح: '+BLOCKN[s.place+1]+' واحد = '+ar(10)+' '+BLOCKN[s.place]+'.':t.type==='carry'?'تلميح: '+ar(10)+' '+BLOCKN[s.place]+' = '+BLOCKN[s.place+1]+' واحد.':'تلميح: عدّ المكعبات.';\n    box.appendChild(lbl);\n    renderBlocksFor(s,t.type);\n  }\n  function checkAnswer(){\n    if(ti>=tasks.length)return;\n    const t=tasks[ti],s=steps[t.step];\n    const v=parseNum($('as-pIn').value);\n    const fb=$('as-pFb');\n    if(v==null){fb.textContent='اكتب إجابتك بالأرقام أولًا.';fb.className='pfb bad';return;}\n    if(v===expected(t,s)){\n      ti++;\n      renderSheet();markActive();\n      if(ti>=tasks.length){countProblem();showStep();return;}\n      renderPractice();\n      fb.textContent='صحيح! ✓ أكمل.';fb.className='pfb ok';\n    }else{\n      attempts++;probWrong=true;\n      fb.textContent='ليست الإجابة، جرّب مرة أخرى.';fb.className='pfb bad';\n      if(attempts>=2)showHint();\n    }\n  }\n  function renderSide(){\n    const prac=mode==='practice';\n    $('as-practice').hidden=!prac;\n    $('as-ask').hidden=prac;$('as-explain').hidden=prac;$('as-navRow').hidden=prac;\n    if(prac)renderPractice();else{stepText();renderBlocks();}\n  }\n\n  // ---- text ----\n  function stepText(){\n    if(idx>=steps.length)return;\n    const s=steps[idx];\n    $('as-count').textContent='الخطوة '+ar(idx+1)+' من '+ar(steps.length);\n    $('as-place').textContent=PLACES[s.place];\n    $('as-progI').style.width=((idx+1)/steps.length*100)+'%';\n    if(op==='add'){\n      if(s.finalCarry){\n        $('as-stepTitle').textContent='الحمل الأخير';\n        $('as-ask').textContent='بقي معنا حمل واحد، نكتبه في خانة '+PLACES[s.place]+'.';\n        $('as-explain').textContent='اكتمل الحل. الناتج '+ar(ans)+'.';\n      }else{\n        $('as-stepTitle').textContent='نجمع '+PLACES[s.place];\n        $('as-ask').textContent=ar(s.d1)+' + '+ar(s.d2)+(s.cin?' + '+ar(s.cin)+' حمل من الخطوة السابقة':'')+' = '+ar(s.sum);\n        $('as-explain').textContent=s.cout\n          ?'الناتج '+ar(s.sum)+' فيه عشرة كاملة: نكتب '+ar(s.w)+' في '+PLACES[s.place]+' ونحمل واحدًا إلى '+PLACES[s.place+1]+'، أي نحوّل '+ar(10)+' '+BLOCKN[s.place]+' إلى '+BLOCKN[s.place+1]+' واحد.'\n          :'نكتب '+ar(s.w)+' في خانة '+PLACES[s.place]+'، ولا حمل في هذه الخطوة.';\n      }\n    }else{\n      $('as-stepTitle').textContent='نطرح '+PLACES[s.place];\n      if(s.borrowed){\n        $('as-ask').textContent='الرقم الأصلي أصغر من '+ar(s.d2)+'، فنستلف من '+PLACES[s.place+1]+' ليصبح '+ar(s.d1)+'.';\n        $('as-explain').textContent=ar(s.d1)+' − '+ar(s.d2)+' = '+ar(s.w)+'، نكتب '+ar(s.w)+' في '+PLACES[s.place]+'. الاستلاف يعني تفكيك '+BLOCKN[s.place+1]+' واحد إلى '+ar(10)+' '+BLOCKN[s.place]+'.';\n      }else{\n        $('as-ask').textContent=ar(s.d1)+' − '+ar(s.d2)+' = '+ar(s.w);\n        $('as-explain').textContent='نكتب '+ar(s.w)+' في خانة '+PLACES[s.place]+'، ولا استلاف في هذه الخطوة.';\n      }\n    }\n    $('as-prev').disabled=idx===0;\n    $('as-next').textContent=idx===steps.length-1?'الناتج ✓':'التالي ←';\n  }\n\n  function showStep(){\n    renderSheet();markActive();renderSide();\n    const done=mode==='explain'?idx>=steps.length:ti>=tasks.length;\n    $('as-doneCard').hidden=!done;\n    if(done){\n      $('as-result').hidden=false;\n      $('as-resBig').innerHTML=ar(a)+(op==='add'?' + ':' − ')+ar(b)+' = <em>'+ar(ans)+'<\/em>';\n      $('as-resSub').textContent=op==='add'?'ناتج الجمع':'الباقي بعد الطرح';\n      const withRegroup=op==='add'?steps.some(s=>s.cout):steps.some(s=>s.borrowed);\n      $('as-doneTxt').textContent=mode==='practice'?'حللت المسألة بنفسك خانة خانة من اليمين إلى اليسار'+(withRegroup?(op==='add'?' مع الحمل':' مع الاستلاف'):'')+'، ووصلت إلى الناتج '+ar(ans)+'.':'حللنا المسألة خانة خانة من اليمين إلى اليسار'+(withRegroup?(op==='add'?' مع الحمل':' مع الاستلاف'):'')+'، ووصلنا إلى الناتج '+ar(ans)+'.';\n    }\n  }\n\n  function startProblem(na,nb){\n    a=na;b=nb;buildSteps();\n    // carry row for addition; reduced-digit row for subtraction (recomputed below)\n    carries=[];borrows=[];\n    if(op==='add'){\n      steps.forEach((s,i)=>{if(s.cout)carries.push({col:s.place+1,v:1,at:s.at,step:i});});\n    }else{\n      steps.forEach((s,i)=>{if(s.lent)s.lent.forEach(x=>borrows.push({col:x.col,v:x.v,at:s.at,step:i}));});\n    }\n    buildTasks();ti=0;attempts=0;probWrong=false;probHint=false;\n    idx=0;\n    $('as-result').hidden=true;\n    $('as-expr').textContent=ar(a)+(op==='add'?' + ':' − ')+ar(b);\n    $('as-tag').textContent=op==='add'?'جمع':'طرح';\n    showStep();\n  }\n\n  function genExample(){\n    // ensure at least one regroup\n    const lo=digits===2?10:100, hi=digits===2?99:999;\n    for(let tries=0;tries<200;tries++){\n      const x=lo+Math.floor(Math.random()*(hi-lo+1));\n      const y=lo+Math.floor(Math.random()*(hi-lo+1));\n      if(op==='add'){\n        const A=digitsOf(x,digits),B=digitsOf(y,digits);\n        if(A.some((d,i)=>d+B[i]>=10)){startProblem(x,y);return;}\n      }else{\n        const hi1=Math.max(x,y),lo1=Math.min(x,y);\n        const A=digitsOf(hi1,digits),B=digitsOf(lo1,digits);\n        if(A.some((d,i)=>d<B[i])){startProblem(hi1,lo1);return;}\n      }\n    }\n    startProblem(op==='add'?58:81,op==='add'?67:36); // fallback always regroups\n  }\n\n  // ---- wiring (element listeners only) ----\n  function setOp(o){if(op===o)return;op=o;\n    $('as-opAdd').setAttribute('aria-pressed',String(o==='add'));\n    $('as-opSub').setAttribute('aria-pressed',String(o==='sub'));\n    genExample();}\n  function setDigits(d){if(digits===d)return;digits=d;\n    $('as-d2').setAttribute('aria-pressed',String(d===2));\n    $('as-d3').setAttribute('aria-pressed',String(d===3));\n    genExample();}\n  function setMode(m){if(mode===m)return;mode=m;\n    $('as-modeExp').setAttribute('aria-pressed',String(m==='explain'));\n    $('as-modePrac').setAttribute('aria-pressed',String(m==='practice'));\n    idx=0;ti=0;attempts=0;\n    $('as-result').hidden=true;\n    showStep();}\n  $('as-modeExp').onclick=()=>setMode('explain');\n  $('as-modePrac').onclick=()=>setMode('practice');\n  $('as-pCheck').onclick=()=>checkAnswer();\n  $('as-pHint').onclick=()=>showHint();\n  $('as-pIn').addEventListener('keydown',ev=>{if(ev.key==='Enter'){ev.preventDefault();checkAnswer();}});\n  $('as-opAdd').onclick=()=>setOp('add');\n  $('as-opSub').onclick=()=>setOp('sub');\n  $('as-d2').onclick=()=>setDigits(2);\n  $('as-d3').onclick=()=>setDigits(3);\n  $('as-rand').onclick=()=>genExample();\n  $('as-again').onclick=()=>genExample();\n  $('as-custom2').onclick=()=>{const bx=$('as-customBox');bx.open=true;};\n  $('as-next').onclick=()=>{if(idx<steps.length){idx++;showStep();}};\n  $('as-prev').onclick=()=>{if(idx>0){idx--;showStep();}};\n  function solveCustom(){\n    const na=parseNum($('as-ca').value), nb=parseNum($('as-cb').value);\n    const err=$('as-cErr');\n    let m='';\n    if(na==null||nb==null)m='اكتب عددين صحيحين موجبين حتى ٩٩٩.';\n    else if(op==='sub'&&na<nb)m='في الطرح اجعل العدد الأول أكبر من الثاني أو مساويًا له.';\n    else if(op==='add'&&na+nb>999&&digits<3)m='ناتج الجمع أكبر من ثلاث خانات؛ جرّب أعدادًا أصغر أو اختر ثلاثة أرقام.';\n    if(m){err.textContent=m;err.hidden=false;return;}\n    err.hidden=true;\n    if(String(Math.max(na,nb)).length>2)setDigits(3);else setDigits(2);\n    startProblem(op==='sub'?Math.max(na,nb):na, op==='sub'?Math.min(na,nb):nb);\n    const bx=$('as-customBox');bx.open=false;\n  }\n  $('as-solve').onclick=()=>solveCustom();\n  $('as-customForm').addEventListener('keydown',ev=>{\n    if(ev.key==='Enter'&&ev.target&&ev.target.tagName==='INPUT'){ev.preventDefault();solveCustom();}\n  });\n\n  genExample();\n})();\n\n\n<\/script>\n<\/body>\n<\/html>\n",
frac: "<!doctype html>\n<html lang=\"ar\" dir=\"rtl\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>معمل الكسور<\/title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Reem+Kufi:wght@500;700&display=swap\">\n<style>\n/* ===== fractions lab module (scoped under .fraclab) ===== */\n.fraclab{--bg:#f6f3ee;--panel:#fffdf8;--paper:#fff;--ink:#1c2a39;--muted:#5f6b7a;--line:#e3dccb;--accent:#7b1fa2;--accent-ink:#fff;--pen:#c62828;--ok:#1e7a3c;--hl:rgba(255,214,64,.45);--soft:#efe9dc;--shade:#8e24aa;--f-body:'IBM Plex Sans Arabic',system-ui,sans-serif;--f-display:'Reem Kufi',system-ui,sans-serif;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.7}\n.fraclab *{box-sizing:border-box}\n.fraclab button{font:inherit;color:inherit;cursor:pointer}\n.fraclab button:focus-visible,.fraclab input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}\n.fraclab .app{max-width:1320px;margin:0 auto;padding:18px 16px 30px;display:flex;flex-direction:column;gap:16px}\n.fraclab header.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}\n.fraclab .brand h1{font-family:var(--f-display);font-weight:700;font-size:clamp(24px,3vw,36px);margin:0;line-height:1.25}\n.fraclab .brand p{margin:2px 0 0;color:var(--muted);font-size:15px}\n.fraclab .tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center}\n.fraclab .seg{display:inline-flex;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px}\n.fraclab .seg button{border:0;background:transparent;padding:7px 16px;border-radius:999px;font-weight:600;color:var(--muted)}\n.fraclab .seg button[aria-pressed=\"true\"]{background:var(--accent);color:var(--accent-ink)}\n.fraclab .picker{display:flex;gap:8px;align-items:flex-start;flex-wrap:wrap}\n.fraclab .chip{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:6px 12px;display:flex;flex-direction:column;align-items:center;line-height:1.35;min-width:96px}\n.fraclab .chip b{font-size:17px}\n.fraclab .chip small{color:var(--muted);font-size:12px}\n.fraclab .chip.rand{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}\n.fraclab .chip.rand small{color:inherit;opacity:.85}\n.fraclab .btn{border:0;background:var(--accent);color:var(--accent-ink);border-radius:10px;padding:9px 18px;font-weight:700}\n.fraclab .btn.ghost{background:var(--soft);color:var(--ink);border:1px solid var(--line)}\n.fraclab .btn:disabled{opacity:.45;cursor:not-allowed}\n.fraclab .main{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(280px,1fr);gap:16px;align-items:start}\n.fraclab .boardPanel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:14px;min-width:0}\n.fraclab .exprRow{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 16px;min-height:48px}\n.fraclab .expr{font-family:var(--f-display);font-size:clamp(24px,3vw,36px);font-weight:700;line-height:1.2}\n.fraclab .tag{font-size:14px;color:var(--accent);border:1.5px solid currentColor;border-radius:999px;padding:1px 12px;font-weight:600}\n.fraclab .work{display:flex;flex-direction:column;gap:14px;background:var(--paper);border-radius:12px;padding:14px;box-shadow:0 1px 0 var(--line),0 8px 22px rgba(20,40,70,.08)}\n.fraclab .barWrap{display:flex;flex-direction:column;gap:8px;align-items:center}\n.fraclab .bar{display:flex;direction:ltr;width:100%;height:64px;border:2.5px solid var(--ink);border-radius:10px;overflow:hidden;background:#fff}\n.fraclab .strip{flex:1;border-left:2px solid var(--ink);background:#fff;transition:background .15s}\n.fraclab .strip:last-child{border-left:0}\n.fraclab .strip.shaded{background:var(--shade)}\n.fraclab .bar.tappable .strip{cursor:pointer}\n.fraclab .bar.tappable .strip:active{opacity:.7}\n.fraclab .barlbl{font-size:14px;color:var(--muted);font-weight:600}\n.fraclab .partsCtl{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap}\n.fraclab .partsCtl .btn{padding:6px 14px;font-size:15px}\n.fraclab .partsCount{font-weight:700;font-size:16px;min-width:120px;text-align:center}\n.fraclab .fracnum{display:inline-flex;flex-direction:column;align-items:center;font-family:var(--f-display);font-weight:700;line-height:1.15;font-size:.62em;vertical-align:middle;margin:0 2px}\n.fraclab .fracnum .fn{padding:0 8px}\n.fraclab .fracnum .fd{border-top:2.5px solid currentColor;padding:0 8px}\n.fraclab .cmpWrap{display:flex;flex-direction:column;gap:18px}\n.fraclab .cmpCol{display:flex;flex-direction:column;gap:8px;align-items:center}\n.fraclab .cmpVs{text-align:center;font-family:var(--f-display);font-size:28px;font-weight:700;color:var(--muted)}\n.fraclab .side{display:flex;flex-direction:column;gap:14px;min-width:0}\n.fraclab .card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px}\n.fraclab .stepTitle{font-family:var(--f-display);font-size:clamp(20px,2.1vw,26px);font-weight:700;margin:0;line-height:1.35}\n.fraclab .ask{font-size:clamp(17px,1.6vw,21px);font-weight:600;margin:0;line-height:1.6}\n.fraclab .explain{font-size:clamp(15px,1.4vw,18px);margin:0;line-height:1.8}\n.fraclab .practice{display:flex;flex-direction:column;gap:10px}\n.fraclab .pRow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}\n.fraclab .pRow input{font:inherit;font-size:20px;font-weight:700;text-align:center;padding:8px 10px;border:2px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink);width:84px}\n.fraclab .inlab{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:13px;color:var(--muted);font-weight:600}\n.fraclab .btn.cmp{font-size:24px;min-width:64px;padding:8px 0}\n.fraclab .pfb{margin:0;font-weight:600;min-height:1.4em;font-size:15px}\n.fraclab .pfb.ok{color:var(--ok)}\n.fraclab .pfb.bad{color:var(--pen)}\n.fraclab .hintbox{background:var(--soft);border-radius:12px;padding:10px 12px;font-size:15px;line-height:1.8;font-weight:600;color:var(--ink)}\n.fraclab .nav{display:flex;gap:8px;flex-wrap:wrap}\n.fraclab .nav .btn{flex:1 1 auto}\n.fraclab footer{color:var(--muted);font-size:14px;text-align:center;padding-top:4px}\n.fraclab footer b{color:var(--ink);font-family:var(--f-display);font-weight:500}\n.fraclab [hidden]{display:none!important}\n@media (max-width:920px){.fraclab .brand{display:none}.fraclab .main{grid-template-columns:minmax(0,1fr)}.fraclab .app{gap:10px;padding-block:10px 20px}.fraclab .boardPanel{padding:10px}.fraclab .card{padding:12px}.fraclab .seg button{padding:6px 12px;font-size:14px}}\n@media (min-width:641px) and (max-width:920px){.fraclab .main{grid-template-columns:minmax(0,1.3fr) minmax(240px,1fr)}}\n\n.fraclab .scard{position:fixed;inset:0;z-index:80;background:rgba(28,42,57,.45);display:flex;align-items:center;justify-content:center;padding:14px}\n.fraclab .scBox{background:var(--panel);border:2px solid var(--accent);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px;width:min(100%,430px);max-height:92vh;overflow:auto}\n.fraclab .scHead{font-family:var(--f-display);font-weight:700;font-size:20px;color:var(--accent)}\n.fraclab .scNameRow label{display:flex;gap:8px;align-items:center;font-weight:600;color:var(--muted);font-size:14px}\n.fraclab .scNameRow input{flex:1;font:inherit;font-size:17px;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink)}\n.fraclab .scView{background:var(--paper);border:1px dashed var(--accent);border-radius:12px;padding:14px;text-align:center;display:flex;flex-direction:column;gap:8px}\n.fraclab .scTitle{font-family:var(--f-display);font-size:24px;font-weight:700}\n.fraclab .scMeta{color:var(--muted);font-size:13px}\n.fraclab .scStats{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}\n.fraclab .scStats>div{display:flex;flex-direction:column;min-width:88px;background:var(--soft);border-radius:10px;padding:8px 10px}\n.fraclab .scStats b{font-size:24px;font-family:var(--f-display)}\n.fraclab .scStats span{font-size:12.5px;color:var(--muted);font-weight:600}\n.fraclab .scNote{font-size:13px;color:var(--muted)}\n\n<\/style>\n<\/head>\n<body>\n<div class=\"fraclab\">\n<div class=\"app\" dir=\"rtl\" lang=\"ar\">\n  <header class=\"top\">\n    <div class=\"brand\">\n      <h1>معمل الكسور<\/h1>\n      <p>يقسّم الطالب ويظلّل ويقارن بنفسه · المرحلة الابتدائية<\/p>\n    <\/div>\n    <div class=\"tools\">\n      <div class=\"seg\" role=\"group\" aria-label=\"النشاط\">\n        <button id=\"fr-actBuild\" aria-pressed=\"true\">ابنِ الكسر<\/button>\n        <button id=\"fr-actName\" aria-pressed=\"false\">سمِّ الكسر<\/button>\n        <button id=\"fr-actCmp\" aria-pressed=\"false\">قارن<\/button>\n      <\/div>\n    <\/div>\n  <\/header>\n\n  <div class=\"picker\">\n    <button class=\"chip rand\" id=\"fr-new\"><b>مثال جديد<\/b><small>تحدٍّ مختلف كل مرة<\/small><\/button>\n    <button class=\"chip\" id=\"fr-cardBtn\"><b>🏅 بطاقة إنجازي<\/b><small>نتيجتك في هذه الجلسة<\/small><\/button>\n  <\/div>\n  <div class=\"scard\" id=\"fr-scard\" hidden>\n    <div class=\"scBox\">\n    <div class=\"scHead\">🏅 بطاقة إنجاز<\/div>\n    <div class=\"scNameRow\"><label>اسم الطالب<input id=\"fr-scName\" autocomplete=\"off\" placeholder=\"اكتب اسمك\"><\/label><\/div>\n    <div class=\"scView\">\n      <div class=\"scTitle\" id=\"fr-scWho\">—<\/div>\n      <div class=\"scMeta\">ركن الرياضيات · معمل الكسور · <span id=\"fr-scDate\"><\/span><\/div>\n      <div class=\"scStats\">\n        <div><b id=\"fr-scDone\">٠<\/b><span>مسائل مكتملة<\/span><\/div>\n        <div><b id=\"fr-scFirst\">٠<\/b><span>من أول مرة دون مساعدة<\/span><\/div>\n        <div><b id=\"fr-scAssist\">٠<\/b><span>بعد تلميح أو محاولة<\/span><\/div>\n      <\/div>\n      <div class=\"scNote\">صوّر البطاقة وأرسلها إلى معلمك<\/div>\n    <\/div>\n    <div class=\"nav\"><button class=\"btn ghost\" id=\"fr-scReset\">جلسة جديدة<\/button><button class=\"btn\" id=\"fr-scClose\">إغلاق<\/button><\/div>\n    <\/div>\n  <\/div>\n\n  <main class=\"main\">\n    <section class=\"boardPanel\" aria-label=\"منطقة العمل\">\n      <div class=\"exprRow\">\n        <div class=\"expr\" id=\"fr-expr\"><\/div>\n        <span class=\"tag\" id=\"fr-tag\"><\/span>\n      <\/div>\n      <div class=\"work\" id=\"fr-work\"><\/div>\n    <\/section>\n\n    <aside class=\"side\">\n      <div class=\"card\">\n        <h2 class=\"stepTitle\" id=\"fr-title\"><\/h2>\n        <p class=\"ask\" id=\"fr-q\"><\/p>\n        <div class=\"practice\" id=\"fr-practice\">\n          <div class=\"pRow\" id=\"fr-rowBuild\">\n            <button class=\"btn\" type=\"button\" id=\"fr-checkBuild\">تحقق<\/button>\n            <button class=\"btn ghost\" type=\"button\" id=\"fr-hintBuild\">تلميح<\/button>\n          <\/div>\n          <div class=\"pRow\" id=\"fr-rowName\" hidden>\n            <label class=\"inlab\">البسط<input id=\"fr-num\" inputmode=\"numeric\" autocomplete=\"off\"><\/label>\n            <label class=\"inlab\">المقام<input id=\"fr-den\" inputmode=\"numeric\" autocomplete=\"off\"><\/label>\n            <button class=\"btn\" type=\"button\" id=\"fr-checkName\">تحقق<\/button>\n            <button class=\"btn ghost\" type=\"button\" id=\"fr-hintName\">تلميح<\/button>\n          <\/div>\n          <div class=\"pRow cmpBtns\" id=\"fr-rowCmp\" hidden>\n            <button class=\"btn cmp\" type=\"button\" id=\"fr-gt\">&gt;<\/button>\n            <button class=\"btn cmp\" type=\"button\" id=\"fr-eq\">=<\/button>\n            <button class=\"btn cmp\" type=\"button\" id=\"fr-lt\">&lt;<\/button>\n            <button class=\"btn ghost\" type=\"button\" id=\"fr-hintCmp\">تلميح<\/button>\n          <\/div>\n          <p class=\"pfb\" id=\"fr-fb\"><\/p>\n        <\/div>\n        <div class=\"hintbox\" id=\"fr-hintBox\" hidden><\/div>\n      <\/div>\n      <div class=\"card\" id=\"fr-doneCard\" hidden>\n        <h2 class=\"stepTitle\">أحسنت! ✓<\/h2>\n        <p class=\"explain\" id=\"fr-doneTxt\"><\/p>\n        <div class=\"nav\">\n          <button class=\"btn\" id=\"fr-again\">مثال جديد<\/button>\n        <\/div>\n      <\/div>\n    <\/aside>\n  <\/main>\n\n  <footer>إعداد <b>الأستاذ عبدالرحمن سلطان<\/b> · معلم الرياضيات<\/footer>\n<\/div>\n\n<\/div>\n<script>\n/* Fractions lab runtime. Element listeners only; no document/window listeners, no observers, no timers — unmount-clean. */\n\n(function(){\n  const $=id=>document.getElementById(id);\n  const AR=['٠','١','٢','٣','٤','٥','٦','٧','٨','٩'];\n  const ar=v=>String(v).replace(/\\d/g,d=>AR[d]);\n  const parseNum=s=>{\n    const t=(s||'').trim().replace(/[٠-٩]/g,d=>String(AR.indexOf(d))).replace(/[,\\s]/g,'');\n    return /^\\d{1,2}$/.test(t)?Number(t):null;\n  };\n  const rnd=n=>Math.floor(Math.random()*n);\n\n  // state\n  let act='build';\n\n  // ---- achievement card (local session, manual screenshot sharing) ----\n  const SS={done:0,first:0,assist:0};\n  let probWrong=false, probHint=false;\n  function updateCard(){\n    $('fr-scWho').textContent=$('fr-scName').value.trim()||'—';\n    const d=new Date();\n    $('fr-scDate').textContent=ar(d.getDate())+'/'+ar(d.getMonth()+1)+'/'+ar(d.getFullYear());\n    $('fr-scDone').textContent=ar(SS.done);\n    $('fr-scFirst').textContent=ar(SS.first);\n    $('fr-scAssist').textContent=ar(SS.assist);\n  }\n  function countProblem(){\n    SS.done++;\n    if(!probWrong&&!probHint)SS.first++;else SS.assist++;\n    updateCard();\n  }\n  $('fr-cardBtn').onclick=()=>{const c=$('fr-scard');c.hidden=!c.hidden;if(!c.hidden)updateCard();};\n  $('fr-scName').addEventListener('input',updateCard);\n  $('fr-scClose').onclick=()=>{$('fr-scard').hidden=true;};\n  $('fr-scReset').onclick=()=>{SS.done=SS.first=SS.assist=0;updateCard();};\n\n  // build\n  let tn=4, tk=3, parts=2, shaded=new Set();\n  // name\n  let nn=4, nk=3;\n  // compare\n  let c1={n:1,d:2}, c2={n:3,d:4};\n\n  function fracEl(k,n){\n    const f=document.createElement('span');f.className='fracnum';\n    const a=document.createElement('span');a.className='fn';a.textContent=ar(k);\n    const b=document.createElement('span');b.className='fd';b.textContent=ar(n);\n    f.append(a,b);return f;\n  }\n  function barEl(count,shadedSet,tappable){\n    const w=document.createElement('div');w.className='bar'+(tappable?' tappable':'');\n    for(let i=0;i<count;i++){\n      const s=document.createElement('div');\n      s.className='strip'+(shadedSet&&shadedSet.has(i)?' shaded':'');\n      if(tappable){const idx=i;s.onclick=()=>{if(shaded.has(idx))shaded.delete(idx);else shaded.add(idx);renderWork();};}\n      w.appendChild(s);\n    }\n    return w;\n  }\n\n  // ---- problem generators ----\n  function newBuild(){\n    const dens=[2,3,4,5,6,8];\n    tn=dens[rnd(dens.length)];\n    tk=1+rnd(tn-1);\n    do{parts=2+rnd(7);}while(parts===tn);\n    shaded=new Set();\n  }\n  function newName(){\n    nn=2+rnd(9);            // 2..10\n    nk=(rnd(5)===0)?nn:1+rnd(nn-1);  // sometimes the whole\n  }\n  function newCmp(){\n    const dens=[2,3,4,6,8];\n    const d1=dens[rnd(dens.length)];\n    c1={d:d1,n:1+rnd(d1-1)};\n    if(rnd(10)<3){\n      const m=2+rnd(2);\n      if(d1*m<=12){c2={d:d1*m,n:c1.n*m};return;}\n    }\n    const d2=dens[rnd(dens.length)];\n    c2={d:d2,n:1+rnd(d2-1)};\n    if(c1.n===c2.n&&c1.d===c2.d)c2.n=c2.n===1?2:c2.n-1;\n  }\n  function newProblem(){\n    if(act==='build')newBuild();else if(act==='name')newName();else newCmp();\n    $('fr-doneCard').hidden=true;\n    $('fr-fb').textContent='';$('fr-fb').className='pfb';\n    $('fr-hintBox').hidden=true;\n    probWrong=false;probHint=false;\n    $('fr-num').value='';$('fr-den').value='';\n    renderWork();renderSide();\n  }\n\n  // ---- board ----\n  function renderWork(){\n    const w=$('fr-work');w.innerHTML='';\n    const expr=$('fr-expr');expr.innerHTML='';\n    if(act==='build'){\n      expr.appendChild(fracEl(tk,tn));\n      $('fr-tag').textContent='ابنِ هذا الكسر';\n      const ctl=document.createElement('div');ctl.className='partsCtl';\n      const minus=document.createElement('button');minus.className='btn ghost';minus.type='button';minus.textContent='− احذف قسمًا';\n      minus.onclick=()=>{if(parts>2){parts--;for(const i of [...shaded])if(i>=parts)shaded.delete(i);renderWork();}};\n      const cnt=document.createElement('span');cnt.className='partsCount';cnt.textContent='الأجزاء: '+ar(parts);\n      const plus=document.createElement('button');plus.className='btn ghost';plus.type='button';plus.textContent='+ أضف قسمًا';\n      plus.onclick=()=>{if(parts<10){parts++;renderWork();}};\n      ctl.append(minus,cnt,plus);\n      const bw=document.createElement('div');bw.className='barWrap';\n      bw.appendChild(barEl(parts,shaded,true));\n      const lbl=document.createElement('div');lbl.className='barlbl';\n      lbl.textContent='اضغط على أي جزء لتظليله · المظلل الآن: '+ar(shaded.size);\n      bw.appendChild(lbl);\n      w.append(ctl,bw);\n    }else if(act==='name'){\n      expr.appendChild(fracEl('؟','؟'));\n      $('fr-tag').textContent='سمِّ الكسر';\n      const shadedSet=new Set();for(let i=0;i<nk;i++)shadedSet.add(i);\n      const bw=document.createElement('div');bw.className='barWrap';\n      bw.appendChild(barEl(nn,shadedSet,false));\n      const lbl=document.createElement('div');lbl.className='barlbl';\n      lbl.textContent='شكل مقسوم إلى أجزاء متساوية، بعضها مظلل';\n      bw.appendChild(lbl);\n      w.appendChild(bw);\n    }else{\n      expr.appendChild(fracEl(c1.n,c1.d));\n      const q=document.createElement('span');q.style.margin='0 6px';q.textContent='؟';expr.appendChild(q);\n      expr.appendChild(fracEl(c2.n,c2.d));\n      $('fr-tag').textContent='قارن الكسرين';\n      const wrap=document.createElement('div');wrap.className='cmpWrap';\n      const col=(c,side)=>{\n        const colE=document.createElement('div');colE.className='cmpCol';\n        const s=new Set();for(let i=0;i<c.n;i++)s.add(i);\n        colE.appendChild(barEl(c.d,s,false));\n        const lbl=document.createElement('div');lbl.className='barlbl';lbl.textContent=side;\n        colE.appendChild(lbl);return colE;\n      };\n      wrap.appendChild(col(c1,'الكسر الأول'));\n      const vs=document.createElement('div');vs.className='cmpVs';vs.textContent='؟';wrap.appendChild(vs);\n      wrap.appendChild(col(c2,'الكسر الثاني'));\n      w.appendChild(wrap);\n    }\n  }\n\n  // ---- side card ----\n  function renderSide(){\n    $('fr-rowBuild').hidden=act!=='build';\n    $('fr-rowName').hidden=act!=='name';\n    $('fr-rowCmp').hidden=act!=='cmp';\n    if(act==='build'){\n      $('fr-title').textContent='ابنِ الكسر بنفسك';\n      $('fr-q').textContent='اقسم الشكل إلى العدد الصحيح من الأجزاء المتساوية بزرّي الإضافة والحذف، ثم اضغط الأجزاء لتظليلها، وبعدها اضغط تحقق.';\n    }else if(act==='name'){\n      $('fr-title').textContent='ما هذا الكسر؟';\n      $('fr-q').textContent='اكتب الكسر الذي يمثله التظليل في الشكل: البسط فوق والمقام تحت، ثم اضغط تحقق.';\n    }else{\n      $('fr-title').textContent='أي إشارة صحيحة؟';\n      $('fr-q').textContent='قارن المساحة المظللة في الشكلين، ثم اختر الإشارة الصحيحة بين الكسر الأول والكسر الثاني.';\n    }\n  }\n\n  function done(txt){\n    countProblem();\n    $('fr-doneCard').hidden=false;\n    $('fr-doneTxt').textContent=txt;\n    $('fr-fb').textContent='صحيح! ✓';$('fr-fb').className='pfb ok';\n  }\n  function bad(txt){\n    probWrong=true;\n    $('fr-fb').textContent=txt;$('fr-fb').className='pfb bad';\n  }\n\n  // ---- checks ----\n  function checkBuild(){\n    if(!$('fr-doneCard').hidden)return;\n    if(parts!==tn){bad('قسّمت الشكل إلى '+ar(parts)+' أجزاء. انظر إلى مقام الكسر المطلوب: إلى كم جزء متساوٍ يجب أن تقسم؟');return;}\n    if(shaded.size!==tk){bad('ظللت '+ar(shaded.size)+' من '+ar(parts)+'. انظر إلى بسط الكسر المطلوب: كم جزءًا يجب أن يكون مظللًا؟');return;}\n    done('بنيت الكسر '+ar(tk)+'/'+ar(tn)+' بنفسك: قسمت الشكل إلى '+ar(tn)+' أجزاء متساوية وظللت '+ar(tk)+' منها.');\n  }\n  function checkName(){\n    if(!$('fr-doneCard').hidden)return;\n    const v1=parseNum($('fr-num').value), v2=parseNum($('fr-den').value);\n    if(v1==null||v2==null){bad('اكتب البسط والمقام بالأرقام أولًا.');return;}\n    const nOk=v2===nn, kOk=v1===nk;\n    if(nOk&&kOk){\n      done(nk===nn\n        ?'صحيح: الشكل كله مظلل، والكسر '+ar(nk)+'/'+ar(nn)+' يساوي واحدًا كاملًا.'\n        :'صحيح: الكسر هو '+ar(nk)+'/'+ar(nn)+' — '+ar(nn)+' أجزاء متساوية، ظُلّل '+ar(nk)+' منها.');\n      return;\n    }\n    if(!nOk&&!kOk){bad('جرّب مرة أخرى: عدّ كل الأجزاء المتساوية للمقام، ثم عدّ المظللة فقط للبسط.');return;}\n    if(!nOk){bad('المقام غير صحيح: عدّ كل الأجزاء المتساوية في الشكل.');return;}\n    bad('البسط غير صحيح: عدّ الأجزاء المظللة فقط.');\n  }\n  function checkCmp(sym){\n    if(!$('fr-doneCard').hidden)return;\n    const lhs=c1.n*c2.d, rhs=c2.n*c1.d;\n    const correct=lhs>rhs?'>':lhs<rhs?'<':'=';\n    if(sym!==correct){bad('ليست الإشارة الصحيحة: قارن المساحة المظللة في الشكلين، أيّهما أكبر؟');return;}\n    if(correct==='='){\n      done('متساويان! '+ar(c1.n)+'/'+ar(c1.d)+' و'+ar(c2.n)+'/'+ar(c2.d)+' لهما المساحة المظللة نفسها، فهما كسران متكافئان.');\n    }else{\n      done(correct==='>'\n        ?'صحيح: '+ar(c1.n)+'/'+ar(c1.d)+' أكبر من '+ar(c2.n)+'/'+ar(c2.d)+' لأن مساحته المظللة أكبر.'\n        :'صحيح: '+ar(c1.n)+'/'+ar(c1.d)+' أصغر من '+ar(c2.n)+'/'+ar(c2.d)+' لأن مساحته المظللة أصغر.');\n    }\n  }\n\n  // ---- hints (guide without revealing the answer) ----\n  function showHint(){\n    probHint=true;\n    const box=$('fr-hintBox');box.hidden=false;\n    if(act==='build'){\n      box.textContent='تلميح: المقام (العدد تحت الخط) يخبرك إلى كم جزء متساوٍ تقسّم الشكل. والبسط (فوق الخط) يخبرك كم جزءًا تظلّل.';\n    }else if(act==='name'){\n      box.textContent='تلميح: المقام = عدد كل الأجزاء المتساوية في الشكل. البسط = عدد الأجزاء المظللة فقط. عدّهما بإصبعك على الشاشة.';\n    }else{\n      box.textContent='تلميح: كلما زادت المساحة المظللة من الشكل زادت قيمة الكسر. قارن طول الجزء المظلل في الشكلين.';\n    }\n  }\n\n  // ---- wiring ----\n  function setAct(a){\n    if(act===a)return;act=a;\n    $('fr-actBuild').setAttribute('aria-pressed',String(a==='build'));\n    $('fr-actName').setAttribute('aria-pressed',String(a==='name'));\n    $('fr-actCmp').setAttribute('aria-pressed',String(a==='cmp'));\n    newProblem();\n  }\n  $('fr-actBuild').onclick=()=>setAct('build');\n  $('fr-actName').onclick=()=>setAct('name');\n  $('fr-actCmp').onclick=()=>setAct('cmp');\n  $('fr-new').onclick=()=>newProblem();\n  $('fr-again').onclick=()=>newProblem();\n  $('fr-checkBuild').onclick=()=>checkBuild();\n  $('fr-checkName').onclick=()=>checkName();\n  $('fr-gt').onclick=()=>checkCmp('>');\n  $('fr-eq').onclick=()=>checkCmp('=');\n  $('fr-lt').onclick=()=>checkCmp('<');\n  $('fr-hintBuild').onclick=()=>showHint();\n  $('fr-hintName').onclick=()=>showHint();\n  $('fr-hintCmp').onclick=()=>showHint();\n  $('fr-rowName').addEventListener('keydown',ev=>{\n    if(ev.key==='Enter'&&ev.target&&ev.target.tagName==='INPUT'){ev.preventDefault();checkName();}\n  });\n\n  newProblem();\n})();\n\n\n<\/script>\n<\/body>\n<\/html>\n",
div: "<!doctype html>\n<html lang=\"ar\" dir=\"rtl\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n<title>القسمة خطوة بخطوة<\/title>\n<meta name=\"claude:viewport-fit-sides\" content=\"cover\">\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Reem+Kufi:wght@500;700&display=swap\">\n<style>\n\n/* Layout: squared math-notebook sheet on the left (board), teacher's step card + multiples table on the right; stacks on phones */\n:root{\n  --bg:#e9eef3; --panel:#ffffff; --paper:#fdfdf9; --grid:#c7d7ea; --ink:#1b2944; --muted:#5b6a80;\n  --line:#d4dce6; --accent:#2457c5; --accent-ink:#ffffff; --pen:#c8322e; --ok:#1d8a4b; --ok-bg:#e3f5ea;\n  --bad-bg:#fdeaea; --hl:rgba(255,226,70,.62); --zero:#c26a12; --soft:#f1f5fa;\n  --f-display:\"Reem Kufi\",\"IBM Plex Sans Arabic\",Tahoma,sans-serif;\n  --f-body:\"IBM Plex Sans Arabic\",Tahoma,\"Segoe UI\",sans-serif;\n  --z:1;\n  --cw:calc(clamp(30px,3.5vw,56px) * var(--z));\n}\n@media (prefers-color-scheme:dark){:root:not([data-theme=\"light\"]){\n  --bg:#0f141b; --panel:#161d27; --paper:#1a2330; --grid:#2a3a50; --ink:#e7eef8; --muted:#97a6ba;\n  --line:#2a3646; --accent:#7ea6ff; --accent-ink:#0f141b; --pen:#ff7d70; --ok:#55c98a; --ok-bg:#14301f;\n  --bad-bg:#3a1c1c; --hl:rgba(255,214,64,.3); --zero:#f0a24c; --soft:#1d2633; color-scheme:dark}}\n:root[data-theme=\"dark\"]{\n  --bg:#0f141b; --panel:#161d27; --paper:#1a2330; --grid:#2a3a50; --ink:#e7eef8; --muted:#97a6ba;\n  --line:#2a3646; --accent:#7ea6ff; --accent-ink:#0f141b; --pen:#ff7d70; --ok:#55c98a; --ok-bg:#14301f;\n  --bad-bg:#3a1c1c; --hl:rgba(255,214,64,.3); --zero:#f0a24c; --soft:#1d2633; color-scheme:dark}\nhtml,body{background:var(--bg);color:var(--ink)}\nbody{font-family:var(--f-body);font-size:16px;line-height:1.7}\n*{box-sizing:border-box}\nbutton{font:inherit;color:inherit;cursor:pointer}\nbutton:focus-visible,summary:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}\n.app{max-width:1320px;margin:0 auto;padding-block:18px 30px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}\n\nheader.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}\n.brand h1{font-family:var(--f-display);font-weight:700;font-size:clamp(26px,3.2vw,38px);margin:0;line-height:1.2;text-wrap:balance}\n.brand p{margin:2px 0 0;color:var(--muted);font-size:15px}\n.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center}\n.seg{display:inline-flex;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px}\n.seg button{border:0;background:transparent;padding:7px 16px;border-radius:999px;font-weight:600;color:var(--muted)}\n.seg button[aria-pressed=\"true\"]{background:var(--accent);color:var(--accent-ink)}\n.zoom{display:inline-flex;gap:4px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px 6px}\n.zoom button{border:0;background:var(--soft);width:34px;height:34px;border-radius:50%;font-weight:700}\n.zoom span{font-size:13px;color:var(--muted);padding:0 4px}\n\n.picker{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;align-items:center}\n.chip{flex:none;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:6px 12px;display:flex;flex-direction:column;align-items:center;line-height:1.35;min-width:96px}\n.chip b{font-size:17px;white-space:nowrap}\n.chip small{color:var(--muted);font-size:12px}\n.chip[aria-pressed=\"true\"]{border-color:var(--accent);box-shadow:inset 0 0 0 1.5px var(--accent)}\n.chip.rand{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}\n.chip.rand small{color:inherit;opacity:.85}\ndetails.custom{f r=false;S.B=prep(p);S.bi=bi;S.idx=0;S.ans=[];S.tries=[];S.wrong={};S.first=0;S.asked=0;S.hint=false;S.fb=null;renderPicker();render();}\nfunction resetProgress(){finishIfDone();S.counted=false;S.hintEver=false;S.idx=0;S.ans=[];S.tries=[];S.wrong={};S.first=0;S.asked=0;S.hint=false;S.fb=null;render();}\n\nfunction randomProblem(){\n  if(Math.random()<0.3){\n    const d=rnd(3,9),a=(rnd(200,9800)/100).toFixed(2);return {a,d,r:rnd(1,2),label:'عشوائية'};\n  }\n  const two=Math.random()<0.35,d=two?rnd(11,32):rnd(2,9),decs=rnd(1,2);\n  const qc=rnd(two?11:6,two?(decs===1?400:3000):(decs===1?900:2500));\n  let a=(qc*d/Math.pow(10,decs)).toFixed(decs);\n  return {a,d,r:null,label:'عشوائية'};\n}\n\n/* ---------- text ---------- */\nfunction texts(e){\n  const B=S.B,d=B.d;\n  switch(e.t){\n    case 'shift':{const added=(B.showA.split('.')[1]||'').length<B.k;\n      return {title:'حوّل المقسوم عليه إلى عدد كلي',\n        ask:`بكم نضرب المقسوم والمقسوم عليه حتى يصبح المقسوم عليه ${n(B.showB)} عددًا كليًا؟`,\n        after:`المقسوم عليه ${n(B.showB)} فيه ${KW[B.k]} بعد الفاصلة، فنضرب المقسوم والمقسوم عليه في ${n(B.factor)}، أي ننقل الفاصلة في كل منهما ${B.k===1?'منزلة واحدة':B.k===2?'منزلتين':n(B.k)+' منازل'}:`\n          +` ${n(B.showB)} × ${n(B.factor)} = ${n(B.d)}، و ${n(B.showA)} × ${n(B.factor)} = ${n(B.newA)}`+(added?' (أضفنا أصفارًا إلى المقسوم).':'.')\n          +` ثم نقسم ${n(B.newA)} ÷ ${n(B.d)} كما في القسمة على عدد كلي.`};}\n    case 'verify':{const fq=B.rounded||B.qStr,m=mulDec(fq,B.showB);\n      return {title:'تحقق بالضرب',after:B.exact\n        ?`الناتج × المقسوم عليه = المقسوم: ${n(fq)} × ${n(B.showB)} = ${n(m)} ✓`\n        :`الناتج × المقسوم عليه يقارب المقسوم: ${n(fq)} × ${n(B.showB)} = ${n(m)}، وهو قريب من ${n(B.showA)} ✓`};}\n    case 'estimate':{const A=B.p.a,R=B.est.R;\n      return {title:'قدّر الناتج أولًا',after:(norm(A)!==R?`نقرّب المقسوم ${n(A)} إلى ${n(R)}، `:'')+`ثم نقسم: ${n(R)} ÷ ${n(d)} ≈ ${n(B.est.s)}. نحفظ هذا التقدير لنتحقق به من الناتج في النهاية.`};}\n    case 'point':return {title:'ضع الفاصلة العشرية',ask:'أين نضع الفاصلة العشرية في ناتج القسمة؟',after:'نضع الفاصلة العشرية في الناتج فوق الفاصلة العشرية في المقسوم مباشرةً، ثم نقسم كما نقسم الأعداد الكلية.'};\n    case 'divide':{const ask=`كم مرة يحتوي ${n(e.cur)} على ${n(d)}؟`;\n      let after;\n      if(e.first) after=`${n(e.cur)} أصغر من ${n(d)}، فلا يحتويه ولا مرة`+(e.wq?`؛ نكتب ٠ في الناتج`:'')+`، ونضم الرقم التالي من المقسوم.`;\n      else if(e.zeroMid) after=`${n(e.cur)} أصغر من ${n(d)}، فنكتب ٠ في الناتج، ثم ننزل الرقم التالي.`;\n      else after=`يحتويه ${n(e.q)} مرات، لأن ${n(e.q)} × ${n(d)} = ${n(e.q*d)} وهو أكبر مضاعف لـ ${n(d)} لا يزيد على ${n(e.cur)}. نكتب ${n(e.q)} في الناتج.`;\n      return {title:'قسّم',ask,after};}\n    case 'multiply':return {title:'اضرب',after:`${n(e.q)} × ${n(d)} = ${n(e.prod)}، نكتبه تحت ${n(e.cur)} ونرسم خط الطرح.`};\n    case 'subtract':return {title:'اطرح',ask:`${n(e.cur)} − ${n(e.prod)} = ؟`,after:`${n(e.cur)} − ${n(e.prod)} = ${n(e.diff)}، والباقي ${n(e.diff)} أصغر من ${n(d)} ✓`};\n    case 'bring':return e.app\n      ?{title:'أضف صفرًا وأكمل القسمة',after:`انتهت أرقام المقسوم والباقي ليس صفرًا، فنضيف صفرًا إلى المقسوم (لا تتغير قيمته)`+(e.started?` وننزله، فيصبح العدد ${n(e.nc)}.`:`، فيصبح العدد ${n(e.nc)}.`)}\n      :{title:'أنزل الرقم التالي',after:`ننزل الرقم ${n(e.dg)} من المقسوم بجانب الباقي ${n(e.cur)}، فيصبح العدد ${n(e.nc)}.`};\n    case 'verifyR':{const q=B.qStr,r=B.remV;\n      return {title:'تحقق من الناتج',after:`الناتج × المقسوم عليه`+(r?' + الباقي':'')+` = المقسوم: ${n(q)} × ${n(d)}`+(r?` + ${n(r)}`:'')+` = ${n(B.showA)} ✓`};}\n    case 'stop':{const p=B.p;\n      if(p.rem) return e.exact\n        ?{title:'انتهت القسمة',after:`انتهت أرقام المقسوم والباقي صفر. الناتج ${n(B.qStr)} بلا باقٍ.`}\n        :{title:'انتهت القسمة',after:`انتهت أرقام المقسوم، والعدد ${n(e.rem)} أصغر من ${n(d)} فلا نستطيع القسمة عليه، إذن هو الباقي. الناتج ${n(B.qStr)} والباقي ${n(e.rem)}.`};\n      if(e.exact) return {title:'انتهت القسمة',after:`الباقي صفر، إذن انتهت القسمة. الناتج ${n(B.qStr)}.`};\n      if(p.r!=null) return {title:'نتوقف هنا',after:`وصلنا إلى منزلة ${PLACE[p.r+1]}، وهذا يكفي لنقرّب الناتج إلى أقرب ${ROUND[p.r]}.`};\n      return {title:'نتوقف هنا',after:`وصلنا إلى منزلة ${PLACE[4]} والباقي ما زال لا يساوي صفرًا، فالناتج تقريبي: ${n(B.qStr)}.`};}\n    case 'round':{const r=B.p.r;return {title:'قرّب الناتج',ask:`قرّب ${n(B.qStr)} إلى أقرب ${ROUND[r]}.`,\n      after:`ننظر إلى الرقم ${n(e.next)} في منزلة ${PLACE[r+1]}: `+(e.next>=5?`هو ٥ أو أكثر، فنزيد الرقم الذي قبله ١.`:`هو أقل من ٥، فيبقى الرقم الذي قبله كما هو.`)+` إذن ${n(B.qStr)} ≈ ${n(e.rounded)}.`};}\n    case 'check':{const fin=B.rounded||B.qStr;\n      return {title:'تحقق من معقولية الناتج',after:`الناتج ${n(fin)} قريب من التقدير ${n(B.est.s)}، إذن الإجابة معقولة ✓`};}\n  }\n}\n\nfunction wrongMsg(e,v){\n  const d=S.B.d;\n  if(e.t==='divide'){\n    if(v>e.q) return `${n(v)} × ${n(d)} = ${n(v*d)} وهو أكبر من ${n(e.cur)}. جرّب رقمًا أصغر.`;\n    return `${n(v)} × ${n(d)} = ${n(v*d)}، والباقي ${n(e.cur-v*d)} أكبر من ${n(d)} أو يساويه. جرّب رقمًا أكبر.`;\n  }\n  if(e.t==='subtract') return `تحقق بالجمع: ${n(e.prod)} + ${n(v)} = ${n(e.prod+v)} وليس ${n(e.cur)}. أعد الطرح.`;\n  if(e.t==='point') return 'ليس كذلك؛ انظر إلى مكان الفاصلة في المقسوم، فالفاصلة في الناتج تكون فوقها تمامًا.';\n  if(e.t==='shift'){const B=S.B,m=mulDec(B.showB,v);\n    return Number(v)<Number(e.factor)\n      ?`${n(B.showB)} × ${n(v)} = ${n(m)}، وهذا ما زال كسرًا عشريًا. نحتاج عددًا أكبر.`\n      :`${n(B.showB)} × ${n(v)} = ${n(m)}، أصبح عددًا كليًا لكن بأكثر من اللازم. اختر أصغر عدد يجعله كليًا: صفر واحد لكل رقم بعد الفاصلة.`;}\n  if(e.t==='round') return `انظر إلى الرقم ${n(e.next)} الذي يلي منزلة التقريب: هل هو ٥ أو أكثر؟`;\n}\nfunction hintMsg(e){\n  if(e.t==='divide') return `قارن ${n(e.cur)} بجدول المضاعفات: اختر أكبر ناتج لا يزيد على ${n(e.cur)}.`;\n  if(e.t==='subtract') return `اطرح الآحاد أولًا، واستلف من المنزلة التالية إذا احت .hidden=true;\n  const st=$('story');if(p.story){st.hidden=false;st.textContent=p.story;}else st.hidden=true;\n\n  /* board */\n  const cells=new Map();let lines=[],hls=[],targets=[];\n  const put=(w,isNew)=>{const key=w.r+':'+w.c+(w.pt?'p':'');cells.set(key,Object.assign({},w,{isNew}));};\n  B.init.forEach(w=>put(w,false));\n  for(let k=0;k<=S.idx;k++){\n    const ev=B.ev[k],now=k===S.idx,full=k<S.idx||!pending(k);\n    if(full){(ev.writes||[]).forEach(w=>put(w,now));lines=lines.concat(ev.lines||[]);}\n    if(now){hls=ev.hl||[];if(!full)targets=ev.targets||(ev.target?[ev.target]:[]);}\n  }\n  let h=`<div class=\"sheet\" style=\"grid-template-columns:repeat(${B.cols},var(--cw));grid-template-rows:repeat(${B.rows},var(--cw))\">`;\n  h+=`<i class=\"bar\" style=\"grid-row:3;grid-column:${B.C(0)+1}/${B.C(B.maxI)+2}\"><\/i>`;\n  hls.forEach(x=>{h+=`<i class=\"hlc\" style=\"grid-area:${x.r+2}/${x.c+1}\"><\/i>`;});\n  lines.forEach(l=>{h+=`<i class=\"uline\" style=\"grid-row:${l.r+2};grid-column:${l.c1+1}/${l.c2+2}\"><\/i>`;});\n  cells.forEach(w=>{\n    const cls=(w.cls||'')+(w.isNew?' new':'');\n    if(w.pt) h+=`<span class=\"pt ${cls}\" style=\"grid-area:${w.r+2}/${w.c+1}\">,<\/span>`;\n    else h+=`<span class=\"cell ${cls}\" style=\"grid-area:${w.r+2}/${w.c+1}\">${n(w.ch)}<\/span>`;\n  });\n  targets.forEach((x,k)=>{h+=`<span class=\"cell target\" style=\"grid-area:${x.r+2}/${x.c+1}\">${k===targets.length-1?'؟':''}<\/span>`;});\n  h+='<\/div>';\n  $('board').innerHTML=h;\n  if(e.t==='shift'&&pend) $('board').innerHTML=`<div class=\"shiftQ\" dir=\"rtl\"><div>${n(B.showB)} × <span class=\"qm\">؟<\/span> = عدد كلي<\/div><div>${n(B.showA)} × <span class=\"qm\">؟<\/span><\/div><p>نضرب المقسوم والمقسوم عليه في العدد نفسه<\/p><\/div>`;\n\n  /* result strip */\n  const res=$('result'),showRes=['stop','round','check','verify','verifyR'].includes(e.t),fin=['check','verify','verifyR'].includes(e.t);\n  if(showRes){\n    const eq=B.exact||p.rem?'=':'≈';\n    let big=`${n(B.showA)} ÷ ${n(B.showB)} ${eq} <em>${n(B.qStr)}<\/em>`+(p.rem&&B.remV?` والباقي <em>${n(B.remV)}<\/em>`:'');\n    let sub='';\n    if(fin&&p.final) sub=p.final;\n    if(B.rounded&&(fin||(e.t==='round'&&!pend))) sub=`وبالتقريب إلى أقرب ${ROUND[p.r]}: ${n(B.qStr)} ≈ <b>${n(B.rounded)}<\/b>`;\n    if(fin&&p.unit) sub+=(sub?'<br>':'')+`${p.ans} ≈ <b>${n(B.rounded||B.qStr)}<\/b> ${p.unit}`;\n    res.innerHTML=`<div class=\"big\">${big}<\/div>`+(sub?`<div class=\"sub\">${sub}<\/div>`:'');res.hidden=false;\n  } else res.hidden=true;\n\n  /* phases */\n  const ph=e.phase;const P=[['div','قسّم'],['mul','اضرب'],['sub','اطرح'],['bring','أنزل']];\n  $('phases').innerHTML=P.map((x,k)=>`<span class=\"phase${ph===x[0]?' on':''}\">${x[1]}<\/span>`+(k<3?'<span class=\"arr\">←<\/span>':'')).join('')+'<span class=\"rep\">ثم كرّر<\/span>';\n\n  /* step card */\n  const T=texts(e),total=B.ev.length,last=S.idx===total-1;\n  let c=`<div class=\"stepHead\"><span>الخطوة ${n(S.idx+1)} من ${n(total)}<\/span>`+(S.mode==='practice'?`<span class=\"score\">من أول محاولة: <b>${n(S.first)}<\/b> من ${n(S.asked)}<\/span>`:'')+`<\/div>`;\n  c+=`<div class=\"prog\"><i style=\"width:${(S.idx+1)/total*100}%\"><\/i><\/div>`;\n  c+=`<h2 class=\"stepTitle\">${T.title}<\/h2>`;\n  if(T.ask) c+=`<p class=\"ask\">${T.ask}<\/p>`;\n  if(pend){\n    if(S.mode==='teach') c+=`<p class=\"think\">اطرح السؤال على الطلاب، ثم اضغط «أظهر الإجابة».<\/p>`;\n    else c+=answerArea(e);\n  } else c+=`<p class=\"explain\">${T.after}<\/p>`;\n  if(S.fb) c+=`<p class=\"fb ${S.fb.ok?'ok':'bad'}\">${S.fb.text}<\/p>`;\n  else if(S.hint&&pend) c+=`<p class=\"fb ok\">💡 ${hintMsg(e)}<\/p>`;\n  c+=`<div class=\"nav\">`;\n  c+=`<button class=\"btn ghost\" id=\"prev\" ${S.idx===0?'disabled':''}>→ السابق<\/button>`;\n  if(pend&&S.mode==='practice') c+=`<button class=\"btn ghost\" id=\"hintB\">💡 تلميح<\/button>`;\n  if(last){\n    c+=`<button class=\"btn\" id=\"nextProb\">المسألة التالية ←<\/button>`;\n  } else if(pend&&S.mode==='teach') c+=`<button class=\"btn\" id=\"next\">أظهر الإجابة<\/button>`;\n  else c+=`<button class=\"btn\" id=\"next\" ${pend?'disabled':''}>${pend?'أجب أولًا':'التالي ←'}<\/button>`;\n  c+=`<\/div>`;\n  if(last) c+=`<div class=\"nav\"><button class=\"btn ghost\" id=\"again\">أعد المسألة<\/button><button class=\"btn ghost\" id=\"rand2\">🎲 مسألة عشوائية<\/button><\/div>`;\n  $('step').innerHTML=c;\n  bindStep(e);\n\n  /* multiples table */\n  renderTable(e,pend);\n}\n\nfunction answerArea(e){\n  const wr=S.wrong[S.idx]||[];\n  if(e.t==='divide'){\n    let s='<div class=\"pad\">';for(let k=0;k<10;k++)s+=`<button data-v=\"${k}\" class=\"${wr.includes(k)?'wrong':''}\">${n(k)}<\/button>`;return s+'<\/div>';\n  }\n  if(e.t==='point') return `<div class=\"opts\">${e.opts.map(o=>`<button data-v=\"${o.v}\" class=\"${wr.includes(o.v)?'wrong':''}\">${o.t}<\/button>`).join('')}<\/div>`;\n  if(e.t==='subtract'||e.t==='shift') return `<div class=\"opts row\">${e.opts.map(o=>`<button data-v=\"${o}\" class=\"${wr.includes(String(o))?'wrong':''}\">${n(o)}<\/button>`).join('')}<\/div>`;\n  if(e.t==='round') return `<div class=\"opts row\">${e.opts.map(o=>`<button data-v=\"${o}\" class=\"${wr.includes(o)?'wrong':''}\">${n(o)}<\/button>`).join('')}<\/div>`;\n  return '';\n}\n\nfunction bindStep(e){\n  const q=s=>$('step').querySelector(s);\n  if(q('#prev')) q('#prev').onclick=prev;\n  if(q('#next')) q('#next').onclick=next;\n  if(q('#hintB')) q('#hintB').onclick=()=>{S.hint=true;S.hintEver=true;S.fb=null;render();};\n  const bk=LS[S.lesson].book;\n  if(q('#nextProb')) q('#nextProb').onclick=()=>{if(S.bi>=0&&S.bi<bk.length-1)load(bk[S.bi+1],S.bi+1);else load(LS[S.lesson].rand(),-1);};\n  if(q('#again')) q('#again').onclick=resetProgress;\n  if(q('#rand2')) q('#rand2').onclick=()=>load(LS[S.lesson].rand(),-1);\n  $('step').querySelectorAll('.pad button,.opts button').forEach(b=>b.onclick=()=>answer(b.dataset.v));\n}\n\nfunction renderTable(e,pend){\n  const d=S.B.d;let cur=null,pick=null,compare=false;\n  if(e.t==='divide'){cur=e.cur;if(!pend){pick=e.q;compare=true;}else if(S.mode==='practice'&&(S.hint||S.tries[S.idx]))compare=true;}\n  if(e.t==='multiply'){pick=e.q;}\n  const tried=(e.t==='divide'&&S.wrong[S.idx])||[];\n  let s=`<h3>جدول مضاعفات ${n(d)}<\/h3><p>${cur!=null&&compare?`نبحث عن أكبر ناتج لا يزيد على ${n(cur)}`:'استعن به لتعرف رقم الناتج بدل التخمين'}<\/p><div class=\"mults\">`;\n  for(let k=1;k<=9;k++){\n    let cls='m';\n    if(pick===k)cls+=' pick';else if(tried.includes(k))cls+=' tried';\n    else if(compare&&cur!=null)cls+=k*d<=cur?' okr':' over';\n    s+=`<div class=\"${cls}\"><span>${n(k)} × ${n(d)}<\/span><b>${n(k*d)}<\/b><\/div>`;\n  }\n  $('tbl').innerHTML=s+'<\/div>';\n}\n\n/* ---------- actions ---------- */\nfunction answer(v){\n  const e=S.B.ev[S.idx];if(!pending(S.idx)||S.mode!=='practice')return;\n  let ok,val=v;\n  if(e.t==='divide'){val=+v;ok=val===e.q;}\n  else if(e.t==='subtract'){val=+v;ok=val===e.diff;}\n  else if(e.t==='point')ok=v==='above';\n  else if(e.t==='shift')ok=v===e.factor;\n  else if(e.t==='round')ok=v===e.rounded;\n  if(ok){S.ans[S.idx]=true;S.asked++;if(!S.tries[S.idx])S.first++;S.fb={ok:true,text:PRAISE[Math.floor(Math.random()*PRAISE.length)]};S.hint=false;}\n  else{S.tries[S.idx]=(S.tries[S.idx]||0)+1;(S.wrong[S.idx]=S.wrong[S.idx]||[]).push(e.t==='divide'?val:String(v));S.fb={ok:false,text:wrongMsg(e,val)};}\n  render();\n  finishIfDone();\n}\nfunction next(){\n  if(pending(S.idx)){if(S.mode==='teach'){S.ans[S.idx]=true;S.fb=null;render();}return;}\n  if(S.idx<S.B.ev.length-1){S.idx++;S.fb=null;S.hint=false;render();finishIfDone();}\n}\nfunction prev(){if(S.idx>0){S.idx--;S.fb=null;S.hint=false;render();}}\n\nfunction setMode(m){resetProgress();S.mode=m;$('mTeach').setAttribute('aria-pressed',m==='teach');$('mPractice').setAttribute('aria-pressed',m==='practice');render();}\n$('mTeach').onclick=()=>setMode('teach');\n$('mPractice').onclick=()=>setMode('practice');\nfunction zoom(dz){S.z=Math.min(1.8,Math.max(0.7,Mat );border-bottom-width:4px}\n.scHead{font-family:var(--display);font-size:1.6rem;color:var(--orange)}\n.scNameRow{width:100%}\n.scNameRow label{display:flex;gap:8px;align-items:center;font-weight:600;color:var(--ink-2);font-size:.95rem;width:100%}\n.scNameRow input{flex:1;font:inherit;font-size:1.05rem;padding:6px 10px;border:2px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}\n.scView{width:100%;background:#fff;border:2px dashed var(--orange);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px}\n.scTitle{font-family:var(--display);font-size:1.7rem}\n.scMeta{color:var(--ink-2);font-size:.8rem}\n.scStats{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}\n.scStats>div{display:flex;flex-direction:column;min-width:88px;background:var(--paper);border:1.5px solid var(--line);border-radius:10px;padding:8px 10px}\n.scStats b{font-size:1.6rem;font-family:var(--display)}\n.scStats span{font-size:.75rem;color:var(--ink-2);font-weight:600}\n.scNote{font-size:.8rem;color:var(--ink-2)}\n.scBtns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}\n.scBtns .btn{font-size:1.3rem;padding:6px 22px 2px}\n\n#printOv{z-index:50;background:rgba(16,22,32,.88)}\n.pcCard{max-height:92vh;overflow:auto;background:#fffaf0}\n.pcView{background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:12px;text-align:right}\n.pcView .pc-head{display:flex;align-items:center;gap:10px;border-bottom:2px solid var(--ink);padding-bottom:8px;margin-bottom:10px}\n.pcView .pc-head img{width:64px;border-radius:6px}\n.pcView h1{font-size:1.1rem;margin:0 0 2px;font-family:var(--display)}\n.pcView .pc-sub{font-size:.75rem;color:#555}\n.pcView table{width:100%;border-collapse:collapse;font-size:.85rem}\n.pcView td{border:1px solid #bbb;padding:4px 8px}\n.pcView td:first-child{width:40%;color:#555}\n.pcView .pc-weak td:last-child{color:#b00;font-weight:700}\n.pcView .pc-sign{display:flex;justify-content:space-between;margin-top:20px;font-size وت\">♪<\/button>\n\n<script>\n(()=>{\nconst AR='٠١٢٣٤٥٦٧٨٩';\nconst ar=n=>String(n).replace(/\\d/g,d=>AR[d]);\nconst $=id=>document.getElementById(id);\nconst store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};\nconst rnd=(a,b)=>a+Math.random()*(b-a);\nconst shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};\nconst ease=t=>1-Math.pow(1-t,3);\nconst FONT=s=>Math.round(s)+'px Lalezar, \"Readex Pro\", Tahoma, sans-serif';\n\nlet saved={};try{saved=JSON.parse(store.get('dh-progress')||'{}')||{}}catch(e){saved={}}\nfunction save(){store.set('dh-progress',JSON.stringify(saved))}\n\n/* --- نسخة مطوّرة v1: مستويات الصعوبة --- */\nconst DIFFS={easy:{name:'سهل',maxb:5,dmul:1.5,dbl:1},mid:{name:'متوسط',maxb:10,dmul:1,dbl:1},hard:{name:'متقدم',maxb:12,dmul:.8,dbl:1}};\nlet diff=store.get('dh-diff')||'mid';if(!DIFFS[diff])diff='mid';\nfunction skey(t){return t+'|'+(G&&G.diff?G.diff:diff)}\nfunction factsFor(t){const D=DIFFS[diff];\n  if(t==='mix'){const all=[];for(let a=2;a<=12;a++)for(let b=1;b<=D.maxb;b++)all.push([a,b]);return shuffle(all).slice(0,15)}\n  const base=[];for(let b=1;b<=D.maxb;b++)base.push([t,b]);\n  if(diff==='easy')return shuffle(base.concat(base.map(f=>[f[0],f[1]])));\n  return shuffle(base)}\n\n/* ================= sound ================= */\nlet ac=null,muted=store.get('dh-mute')==='1';\nfunction audio(){if(!ac){try{ac=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(ac&&ac.state==='suspended')ac.resume();return ac}\nfunction tone(f,d,type,v,when,slide){if(muted||!ac)return;const t=ac.currentTime+(when||0),o=ac.createOscillator(),g=ac.createGain();o.type=type||'sine';\n  o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+d);g.gain.setValueAtTime(v||.2,t);g.gain.exponentialRampToValueAtTime(.001,t+d);\n  o.connect(g).connect(ac.destination);o.start(t);o.stop(t+d) لعدد وضع صفرًا عن يمينه: <b>${ar(b)} ← ${ar(p)}<\/b>`;\n    case 11:return b<10?`جدول <b>١١<\/b> حتى ٩: كرّر الرقم مرتين: <b>${ar(b)} × ١١ = ${ar(p)}<\/b>`:`اضرب في ١٠ ثم أضف العدد: <b>${ar(10*b)} + ${ar(b)} = ${ar(p)}<\/b>`;\n    case 12:return `اضرب في ١٠ ثم أضف ضعف العدد: <b>${ar(10*b)} + ${ar(2*b)} = ${ar(p)}<\/b>`;}\n  return ''}\nfunction showFb(q,yours){\n  $('fbT').textContent=yours==null?M.late:M.bad;\n  $('fbFact').textContent=ar(q.a)+' × '+ar(q.b)+' = '+ar(q.ans);\n  $('fbYours').innerHTML=yours==null?'انتهى الوقت. احفظ هذه الحقيقة جيدًا:':'إجابتك <s>'+ar(yours)+'<\/s> والإجابة الصحيحة <b>'+ar(q.ans)+'<\/b>';\n  const d=$('fbDots');d.innerHTML='';d.style.gridTemplateColumns='repeat('+q.b+',auto)';for(let i=0;i<q.a*q.b;i++)d.appendChild(document.createElement('i'));\n  $('fbCap').textContent=ar(q.a)+' صفوف، في كل صف '+ar(q.b)+' = '+ar(q.ans)+' نقطة';\n  $('fbTip').innerHTML='طريقة سريعة: '+tip(q.a,q.b);\n  $('fb').hidden=false;$('fbGo').focus()}\n$('fbGo').onclick=()=>{$('fb').hidden=true;nextQ()};\n\nfunction finish(){\n  G.phase='done';$('pad').hidden=true;setPad();const m=G.mistakes,stars=m===0?3:m<=2?2:1;\n  const k=skey(G.t),rec=saved[k]||{};saved[k]={stars:Math.max(rec.stars||0,stars),best:Math.max(rec.best||0,G.score)};save();\n  $('dTitle').textContent=G.t==='mix'?'أنهيت تحدي كل الجداول!':'أنهيت جدول '+ar(G.t)+'!';\n  $('dStars').innerHTML=starsHTML(stars);$('dScore').textContent=ar(G.score);\n  $('dMsg').textContent=stars===3?'بطل حقيقي! بدون أي خطأ':stars===2?'رائع! أعد المرحلة لتحصل على ٣ نجوم':'أحسنت! تدرّب على هذا الجدول مرة أخرى لتجمع نجومًا أكثر';\n  const nx=G.t==='mix'?null:(G.t<12?G.t+1:'mix');$('dNext').hidden=nx==null;\n  if(nx!=null){$('dNext').textContent=nx==='mix'?'تحدي كل الجداول':'جدول '+ar(nx);$('dNext').onclick=()=>openLevel(nx)}\n  fillReport();\n  $('done').hidden=false;sfx.win();for(let i=0;i<5;i++)burst(rnd(0,W),rnd(H*.2,H*.5),20,['#ffc23c','#ff7a1a','#22a861','#5cc3ff'],{sh:'r',up:3})}\n$('dAgain').onclick=()=>openLevel(G.t oggle('low',k<.3);if(G.left<=0)doTimeout()}\n    if(G.phase!=='intro'||M.update){if(G.q)M.update(dt,t)}\n    M.draw(t);\n  }else menuScene(t,dt);\n  drawParts();drawPops();\n  const aimOn=!!(G&&M&&M.cursor&&G.phase==='play');if(aimOn)drawAim(t);cv.classList.toggle('aim',aimOn);\n  requestAnimationFrame(loop)}\nresize();buildDiffs();buildMenu();\n(document.fonts&&document.fonts.load?document.fonts.load('40px Lalezar'):Promise.resolve()).catch(()=>{}).finally(()=>requestAnimationFrame(loop));\n})();\n<\/script>\n\n<\/body><\/html>\n"
